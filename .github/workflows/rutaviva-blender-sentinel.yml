name: RutaViva Blender Headless Sentinel

on:
  push:
    branches:
      - rutaviva-blender-sentinel-20260921
    paths:
      - .github/workflows/rutaviva-blender-sentinel.yml

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated sentinel branch
        uses: actions/checkout@v4

      - name: Show runner resources
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU=$(nproc)"
          free -h
          df -h /

      - name: Download and verify Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl -fL --retry 3 --retry-delay 2 \
            -o blender.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 3 --retry-delay 2 \
            -o blender.sha256 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Blender background boot
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" -b --version

      - name: Render one minimal CPU frame
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rutaviva_sentinel.py <<'PY'
          import bpy, math, mathutils, os
          bpy.ops.wm.read_factory_settings(use_empty=True)

          bpy.ops.mesh.primitive_cube_add(location=(0, 0, 1))
          cube = bpy.context.object
          cube.rotation_euler = (math.radians(15), 0, math.radians(25))

          bpy.ops.mesh.primitive_plane_add(size=8, location=(0, 0, 0))

          bpy.ops.object.light_add(type='AREA', location=(3, -4, 6))
          light = bpy.context.object
          light.data.energy = 900
          light.data.shape = 'DISK'
          light.data.size = 5

          bpy.ops.object.camera_add(location=(5, -7, 4.5))
          cam = bpy.context.object
          bpy.context.scene.camera = cam
          direction = mathutils.Vector((0, 0, 1)) - cam.location
          cam.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          scene = bpy.context.scene
          scene.render.engine = 'BLENDER_EEVEE_NEXT'
          scene.render.resolution_x = 256
          scene.render.resolution_y = 256
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = '/tmp/rutaviva_blender_sentinel.png'
          scene.world.color = (0.06, 0.06, 0.06)
          bpy.ops.render.render(write_still=True)

          path = scene.render.filepath
          assert os.path.exists(path) and os.path.getsize(path) > 1000, path
          print(f'SENTINEL_RENDER_PASS path={path} bytes={os.path.getsize(path)}')
          PY
          "$BLENDER_BIN" -b --python /tmp/rutaviva_sentinel.py
          test -s /tmp/rutaviva_blender_sentinel.png
          sha256sum /tmp/rutaviva_blender_sentinel.png
          stat -c 'OUTPUT_BYTES=%s' /tmp/rutaviva_blender_sentinel.png
